<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibition Projects</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  <span class="grid"></span><span class="grain"></span>
</div>

<div id="intro" class="intro">
  <div class="intro-inner">
    <div class="intro-small">WELCOME TO THE</div>
    <div class="intro-title">Exhibition</div>
    <div class="intro-line"></div>
    <div class="intro-sub">SCIENCE &amp; INNOVATION SHOWCASE</div>
  </div>
</div>

<main id="home">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">SCHOOL SCIENCE EXHIBITION</div>
    <h1 id="title">Exhibition Projects</h1>
    <p id="subtitle">Ideas that move, sense, and amaze.</p>
    <div class="hero-rule"><span></span><i>&#10022;</i><span></span></div>
  </header>

  <section class="list-head"><span>OUR PROJECTS</span><span class="line"></span><span id="count"></span></section>
  <section class="cards" id="cards"></section>
  <footer class="foot">Click any project to explore</footer>
</main>

<section id="detail" class="detail" aria-hidden="true">
  <div class="detail-bar">
    <button class="back" id="back">&larr; Back to projects</button>
    <div class="detail-nav">
      <button id="prev" aria-label="Previous project">&lsaquo;</button>
      <button id="next" aria-label="Next project">&rsaquo;</button>
    </div>
  </div>
  <div class="detail-scroll" id="detail-body"></div>
</section>

<script src="/script.js"></script>
</body>
</html>
